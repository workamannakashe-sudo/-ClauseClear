# Render Application Preset for ClauseClear
# Architecture: Node.js Backend API + Vite Frontend Static Web Service

services:
  # ── Backend Web Service (Node.js API) ──────────────────────────
  - type: web
    name: clauseclear-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm run build:backend
    startCommand: node backend/dist/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: MOCK_MODE
        value: "false"
    healthCheckPath: /api/health

  # ── Frontend Web Service (Vite React SPA) ──────────────────────
  - type: web
    name: clauseclear-frontend
    env: static
    buildCommand: npm run build:frontend
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

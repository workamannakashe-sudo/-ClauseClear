services:
  clauseclear:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clauseclear-app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MOCK_MODE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
